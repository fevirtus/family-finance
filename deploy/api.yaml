apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: finance
spec:
  replicas: 2
  selector:
    matchLabels: { app: finance-api }
  template:
    metadata:
      labels: { app: finance-api }
    spec:
      initContainers:
        - name: migrate
          image: ghcr.io/fevirtus/finance-api
          command: [".venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: finance-api-env }
      containers:
        - name: api
          image: ghcr.io/fevirtus/finance-api
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef: { name: finance-api-env }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: finance
spec:
  selector: { app: finance-api }
  ports:
    - { name: http, port: 80, targetPort: http }
